[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "closure-discovery"
version = "0.1.0"
description = "Weak-form closure discovery for reaction-diffusion systems"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "torch>=2.7",
  "matplotlib>=3.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
revision = [
  "scipy>=1.17",
  "pandas>=2.2",
  "sympy>=1.14",
]
pysr = [
  "pysr>=1.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "revision"]
markers = ["cuda: opt-in checks on a locally available CUDA device"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

